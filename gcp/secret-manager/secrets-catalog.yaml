# ==============================================================================
# Google Secret Manager (GSM) Catalog
# Single source of truth for secret declarations and IAM bindings across services.
# ==============================================================================

version: "1.0"
project_id: "project-cbe181a6-46e7-4c7c-8e8"
region: "asia-southeast1"

# All secrets listed here are created and versioned in Google Secret Manager.
# Cloud Run containers bind directly to these secrets via IAM without plain-text exposure in CI.
secrets:
  # ─── Platform Shared Secrets ────────────────────────────────────────────────
  - name: "gemini-api-key"
    description: "Google AI Studio / Gemini API Master Token"
    consumers:
      - "finai-api"
      - "orchestr-ai-api"
      - "knowledge-ai-api"

  # ─── Service Specific Databases & Cryptographic Seeds ───────────────────────
  - name: "devlab-portal-db-url"
    description: "Production Postgres Database URL for DevLab Portal"
    consumers: ["devlab-portal-api"]

  - name: "devlab-portal-session-secret"
    description: "Cookie and session HMAC signing secret for Portal Auth"
    consumers: ["devlab-portal-api"]

  - name: "finai-db-url"
    description: "Neon Postgres Database URL for FinAI Platform"
    consumers: ["finai-api"]

  - name: "orchestrai-db-url"
    description: "Database URL for OrchestrAI multi-agent coordinator"
    consumers: ["orchestr-ai-api"]

  - name: "orchestrai-redis-url"
    description: "Upstash / Memorystore Redis URL for agent message queue and pubsub"
    consumers: ["orchestr-ai-api", "orchestr-ai-intelligence"]

  - name: "knowledgeai-db-url"
    description: "Vector database & document index store URL for KnowledgeAI"
    consumers: ["knowledge-ai-api", "knowledge-ai-crawler"]
